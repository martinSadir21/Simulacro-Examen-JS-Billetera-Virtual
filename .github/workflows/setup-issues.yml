# Crea issues de la actividad para repos creados desde GitHub Classroom.
# Idempotente: crea solamente los issues faltantes por titulo.
name: Setup assignment issues

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: setup-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ensure-assignment-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Crear issues faltantes de la actividad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json
          import os
          import textwrap
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          API = "https://api.github.com"
          ISSUE_LABEL = "classroom-assignment"

          ISSUES = [
              {
                  "title": "[Entrega 1] Vincular CSS y JS al HTML",
                  "body": """
          ## Objetivo
          Conectar la hoja de estilos y el script de JavaScript al archivo `index.html`.

          ## Qué debe cumplirse
          - [ ] Dentro de `<head>`, existe una etiqueta `<link>` que vincula `css/styles.css`.
          - [ ] En `index.html`, existe una etiqueta `<script>` que vincula `js/script.js` (como módulo o con defer).

          ## Commit sugerido
          ```
          feat(html): vincular css y script js al html

          Closes #1
          ```""",
              },
              {
                  "title": "[Entrega 2] Consumir API de Cotizaciones y Contactos con fetch",
                  "body": """
          ## Objetivo
          Realizar peticiones asíncronas con `fetch` o `async/await` al servidor local de Billetera Virtual.

          ## Qué debe cumplirse
          - [ ] En `js/script.js`, consultar cotizaciones en `http://localhost:3000/api/cotizaciones` y contactos en `/api/contactos`.
          - [ ] Opcionalmente enviar la transferencia con `POST /api/transferir` o procesar localmente.
          - [ ] Manejar respuestas con `try...catch` y capturar posibles errores de conexión.

          ## Commit sugerido
          ```
          feat(js): consumir api de cotizaciones con fetch y async await

          Closes #2
          ```""",
              },
              {
                  "title": "[Entrega 3] Renderizar divisas, saldo y transacciones en el DOM",
                  "body": """
          ## Objetivo
          Poblar el selector de monedas con las cotizaciones de la API y renderizar el saldo formateado junto al listado de movimientos.

          ## Qué debe cumplirse
          - [ ] Llenar el `<select id="currencySelector">` con las divisas disponibles (ARS, USD, EUR, BRL, USDT).
          - [ ] Formatear y renderizar el saldo actual en `#balance` y su conversión en `#balanceConvertido`.
          - [ ] Renderizar las transacciones dinámicamente en `#transactionContainer`.

          ## Commit sugerido
          ```
          feat(js): renderizar saldo conversion y movimientos en el dom

          Closes #3
          ```""",
              },
              {
                  "title": "[Entrega 4] Implementar operaciones de ingreso, transferencia y validación",
                  "body": """
          ## Objetivo
          Manejar la apertura/cierre de modales, procesar ingresos de saldo y validar transferencias (montos positivos, saldo suficiente).

          ## Qué debe cumplirse
          - [ ] Abrir y cerrar los modales `#modalIngresar`, `#modalTransferir` y `#modalHistorial`.
          - [ ] Validar monto y destinatario al enviar `#formIngreso` o `#formTransferencia` con `e.preventDefault()`.
          - [ ] Actualizar el saldo reactivamente ante cada movimiento.

          ## Commit sugerido
          ```
          feat(js): implementar ingresos transferencias y validacion de saldos

          Closes #4
          ```""",
              },
              {
                  "title": "[Entrega 5] Persistir saldo, movimientos y permitir reinicio en LocalStorage",
                  "body": """
          ## Objetivo
          Persistir el saldo y el historial de transacciones en `localStorage` y permitir reiniciar la cuenta.

          ## Qué debe cumplirse
          - [ ] Guardar el saldo bajo la clave `'billetera_saldo'` y los movimientos en `'billetera_movimientos'` con `JSON.stringify()`.
          - [ ] Al cargar la página, recuperar saldo y transacciones con `localStorage.getItem()` y `JSON.parse()`.
          - [ ] Al hacer click en `#btnResetBilletera`, eliminar los datos guardados con `localStorage.removeItem()` o `clear()` y reiniciar a $0.

          ## Commit sugerido
          ```
          feat(js): persistir y gestionar movimientos de billetera en localstorage

          Closes #5
          ```""",
              },
          ]

          for _spec in ISSUES:
              _spec["body"] = textwrap.dedent(_spec["body"]).strip()

          def request(method, url, data=None):
              headers = {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              body = None
              if data is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"
                  body = json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          def list_existing_issue_titles():
              titles = set()
              page = 1
              while True:
                  url = f"{API}/repos/{REPO}/issues?state=all&per_page=100&page={page}"
                  headers = {
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      batch = json.loads(resp.read().decode())
                  if not batch:
                      break
                  for item in batch:
                      if item.get("pull_request") is None:
                          title = item.get("title", "").strip()
                          if title:
                              titles.add(title)
                  if len(batch) < 100:
                      break
                  page += 1
              return titles

          def ensure_label_exists(label_name):
              url = f"{API}/repos/{REPO}/labels/{urllib.parse.quote(label_name)}"
              try:
                  request("GET", url)
                  return
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              request(
                  "POST",
                  f"{API}/repos/{REPO}/labels",
                  {
                      "name": label_name,
                      "color": "1d76db",
                      "description": "Issue generado automaticamente para el examen de Classroom",
                  },
              )
              print(f"Etiqueta creada: {label_name}")

          existing_titles = list_existing_issue_titles()
          ensure_label_exists(ISSUE_LABEL)

          created_count = 0
          skipped_count = 0
          for spec in ISSUES:
              if spec["title"] in existing_titles:
                  skipped_count += 1
                  print("Ya existe, se omite: " + spec["title"])
                  continue
              url = f"{API}/repos/{REPO}/issues"
              created = request(
                  "POST",
                  url,
                  {"title": spec["title"], "body": spec["body"], "labels": [ISSUE_LABEL]},
              )
              created_count += 1
              print("Creado issue #" + str(created["number"]) + ": " + spec["title"])
          print(
              "Listo: "
              + str(created_count)
              + " issue(s) creado(s), "
              + str(skipped_count)
              + " ya existentes."
          )
          PY
